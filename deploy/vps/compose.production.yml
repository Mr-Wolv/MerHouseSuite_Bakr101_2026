name: merhouse-production

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MERHOUSE_POSTGRES_DB:?Set MERHOUSE_POSTGRES_DB}
      POSTGRES_USER: ${MERHOUSE_POSTGRES_USER:?Set MERHOUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MERHOUSE_POSTGRES_PASSWORD:?Set MERHOUSE_POSTGRES_PASSWORD}
    volumes:
      - merhouse-postgres-data:/var/lib/postgresql/data
      - ${MERHOUSE_BACKUP_HOST_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MERHOUSE_POSTGRES_USER} -d ${MERHOUSE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    image: ${MERHOUSE_BACKEND_IMAGE:-merhouse-backend:latest}
    build:
      context: ../../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MERHOUSE_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${MERHOUSE_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${MERHOUSE_POSTGRES_PASSWORD}
      MERHOUSE_AUTH_JWT_SECRET: ${MERHOUSE_AUTH_JWT_SECRET:?Set MERHOUSE_AUTH_JWT_SECRET}
      MERHOUSE_AUTH_RECOVERY_EXPOSE_RESET_TOKEN: "false"
      MERHOUSE_AUTH_SEED_ADMIN_ENABLED: "false"
      MERHOUSE_DEPLOYMENT_PUBLIC: "true"
      MERHOUSE_SWAGGER_ENABLED: "false"
      MERHOUSE_CORS_ALLOWED_ORIGINS: ${MERHOUSE_CORS_ALLOWED_ORIGINS:?Set MERHOUSE_CORS_ALLOWED_ORIGINS}
      MERHOUSE_PUBLIC_FRONTEND_URL: ${MERHOUSE_PUBLIC_FRONTEND_URL:?Set MERHOUSE_PUBLIC_FRONTEND_URL}
      MERHOUSE_EMAIL_ENABLED: ${MERHOUSE_EMAIL_ENABLED:-false}
      MERHOUSE_EMAIL_FROM: ${MERHOUSE_EMAIL_FROM:-}
      MERHOUSE_EMAIL_REPLY_TO: ${MERHOUSE_EMAIL_REPLY_TO:-}
      MERHOUSE_SMTP_HOST: ${MERHOUSE_SMTP_HOST:-}
      MERHOUSE_SMTP_PORT: ${MERHOUSE_SMTP_PORT:-587}
      MERHOUSE_SMTP_USERNAME: ${MERHOUSE_SMTP_USERNAME:-}
      MERHOUSE_SMTP_PASSWORD: ${MERHOUSE_SMTP_PASSWORD:-}
      MERHOUSE_SMTP_AUTH: ${MERHOUSE_SMTP_AUTH:-true}
      MERHOUSE_SMTP_STARTTLS_ENABLE: ${MERHOUSE_SMTP_STARTTLS_ENABLE:-true}
      MERHOUSE_AGENT_MODE: ${MERHOUSE_AGENT_MODE:-deterministic}
      MERHOUSE_AGENT_MODEL_ENDPOINT: ${MERHOUSE_AGENT_MODEL_ENDPOINT:-}
      MERHOUSE_AGENT_MODEL_NAME: ${MERHOUSE_AGENT_MODEL_NAME:-}
      MERHOUSE_AGENT_TIMEOUT_SECONDS: ${MERHOUSE_AGENT_TIMEOUT_SECONDS:-15}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    image: ${MERHOUSE_FRONTEND_IMAGE:-merhouse-frontend:latest}
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: ${MERHOUSE_FRONTEND_PUBLIC_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${MERHOUSE_HTTP_BIND:-127.0.0.1:3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ | grep -q '<div id=\"root\"></div>'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  merhouse-postgres-data:
