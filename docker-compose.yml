name: merhouse

services:
  postgres:
    image: postgres:17
    container_name: merhouse-postgres
    environment:
      POSTGRES_DB: ${MERHOUSE_POSTGRES_DB:-merhouse}
      POSTGRES_USER: ${MERHOUSE_POSTGRES_USER:-merhouse_local}
      POSTGRES_PASSWORD: ${MERHOUSE_POSTGRES_PASSWORD:?Set MERHOUSE_POSTGRES_PASSWORD in local .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MERHOUSE_POSTGRES_USER:-merhouse_local} -d ${MERHOUSE_POSTGRES_DB:-merhouse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: merhouse-backend
    build:
      context: ./backend
      dockerfile: backend-compose.Dockerfile
    container_name: merhouse-backend
    depends_on:
      postgres:
        condition: service_healthy
      firebase-emulators:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MERHOUSE_POSTGRES_DB:-merhouse}
      SPRING_DATASOURCE_USERNAME: ${MERHOUSE_POSTGRES_USER:-merhouse_local}
      SPRING_DATASOURCE_PASSWORD: ${MERHOUSE_POSTGRES_PASSWORD:?Set MERHOUSE_POSTGRES_PASSWORD in local .env}
      MERHOUSE_AUTH_RECOVERY_EXPOSE_RESET_TOKEN: ${MERHOUSE_AUTH_RECOVERY_EXPOSE_RESET_TOKEN:-false}
      MERHOUSE_AUTH_SEED_ADMIN_ENABLED: ${MERHOUSE_AUTH_SEED_ADMIN_ENABLED:-false}
      MERHOUSE_AUTH_SEED_ADMIN_EMAIL: ${MERHOUSE_AUTH_SEED_ADMIN_EMAIL:-}
      MERHOUSE_AUTH_SEED_ADMIN_PASSWORD: ${MERHOUSE_AUTH_SEED_ADMIN_PASSWORD:-}
      MERHOUSE_DEPLOYMENT_PUBLIC: ${MERHOUSE_DEPLOYMENT_PUBLIC:-false}
      MERHOUSE_SWAGGER_ENABLED: ${MERHOUSE_SWAGGER_ENABLED:-true}
      MERHOUSE_CORS_ALLOWED_ORIGINS: ${MERHOUSE_CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost,capacitor://localhost,ionic://localhost}
      MERHOUSE_PUBLIC_FRONTEND_URL: ${MERHOUSE_PUBLIC_FRONTEND_URL:-http://localhost:3001}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-merhouse-local}
      FIREBASE_EMULATOR_HOST: ${FIREBASE_EMULATOR_HOST:-}
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    ports:
      - "${MERHOUSE_BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  firebase-emulators:
    build:
      context: .
      dockerfile: firebase-emulators.Dockerfile
    container_name: merhouse-firebase-emulators
    working_dir: /workspace
    command: >
      sh -c "firebase emulators:start --project merhouse-local --only auth"
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-merhouse-local}
    ports:
      - "9099:9099"
      - "4000:4000"
    volumes:
      - ./firebase.json:/workspace/firebase.json
      - firebase-emulator-data:/workspace/.firebase
      - firebase-emulator-cache:/root/.cache/firebase
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9099/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    image: merhouse-frontend
    build:
      context: ./frontend
      dockerfile: frontend-compose.Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-merhouse-local}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_EMULATOR_HOST: ${VITE_FIREBASE_EMULATOR_HOST:-}
    container_name: merhouse-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MERHOUSE_FRONTEND_PORT:-3001}:80"

volumes:
  postgres-data:
  firebase-emulator-data:
  firebase-emulator-cache:
