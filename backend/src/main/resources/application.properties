spring.application.name=merhouse

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/merhouse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:merhouse_local}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MERHOUSE_POSTGRES_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=

server.port=${SERVER_PORT:8080}

springdoc.api-docs.enabled=${MERHOUSE_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${MERHOUSE_SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=MerHouse API
springdoc.swagger-ui.urls[0].url=/v3/api-docs/merhouse-v1
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

merhouse.auth.jwt-secret=${MERHOUSE_AUTH_JWT_SECRET:}
merhouse.auth.jwt-expires-seconds=${MERHOUSE_AUTH_JWT_EXPIRES_SECONDS:3600}
merhouse.auth.recovery.expose-reset-token=${MERHOUSE_AUTH_RECOVERY_EXPOSE_RESET_TOKEN:false}
merhouse.auth.recovery.request-limit=${MERHOUSE_AUTH_RECOVERY_REQUEST_LIMIT:5}
merhouse.auth.recovery.request-window-minutes=${MERHOUSE_AUTH_RECOVERY_REQUEST_WINDOW_MINUTES:60}
merhouse.auth.seed-admin.enabled=${MERHOUSE_AUTH_SEED_ADMIN_ENABLED:false}
merhouse.auth.seed-admin.email=${MERHOUSE_AUTH_SEED_ADMIN_EMAIL:}
merhouse.auth.seed-admin.password=${MERHOUSE_AUTH_SEED_ADMIN_PASSWORD:}
merhouse.access-requests.request-limit=${MERHOUSE_ACCESS_REQUEST_LIMIT:3}
merhouse.access-requests.request-window-hours=${MERHOUSE_ACCESS_REQUEST_WINDOW_HOURS:24}
merhouse.deployment.public=${MERHOUSE_DEPLOYMENT_PUBLIC:false}
merhouse.cors.allowed-origins=${MERHOUSE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost,capacitor://localhost,ionic://localhost}
merhouse.public.frontend-url=${MERHOUSE_PUBLIC_FRONTEND_URL:http://localhost:3000}
merhouse.email.enabled=${MERHOUSE_EMAIL_ENABLED:false}
merhouse.email.from=${MERHOUSE_EMAIL_FROM:}
merhouse.email.reply-to=${MERHOUSE_EMAIL_REPLY_TO:}
merhouse.agent.mode=${MERHOUSE_AGENT_MODE:deterministic}
merhouse.agent.model-endpoint=${MERHOUSE_AGENT_MODEL_ENDPOINT:}
merhouse.agent.model-name=${MERHOUSE_AGENT_MODEL_NAME:}
merhouse.agent.timeout-seconds=${MERHOUSE_AGENT_TIMEOUT_SECONDS:15}
spring.mail.host=${MERHOUSE_SMTP_HOST:localhost}
spring.mail.port=${MERHOUSE_SMTP_PORT:1025}
spring.mail.username=${MERHOUSE_SMTP_USERNAME:}
spring.mail.password=${MERHOUSE_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MERHOUSE_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MERHOUSE_SMTP_STARTTLS_ENABLE:false}
