spring.application.name=merhouse

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/merhouse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:merhouse_local}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MERHOUSE_POSTGRES_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=

server.port=${PORT:${SERVER_PORT:8080}}

springdoc.api-docs.enabled=${MERHOUSE_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${MERHOUSE_SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=MerHouse API
springdoc.swagger-ui.urls[0].url=/v3/api-docs/merhouse-v1
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

merhouse.auth.recovery.expose-reset-token=${MERHOUSE_AUTH_RECOVERY_EXPOSE_RESET_TOKEN:false}
merhouse.auth.recovery.request-limit=${MERHOUSE_AUTH_RECOVERY_REQUEST_LIMIT:5}
merhouse.auth.recovery.request-window-minutes=${MERHOUSE_AUTH_RECOVERY_REQUEST_WINDOW_MINUTES:60}
merhouse.auth.seed-admin.enabled=${MERHOUSE_AUTH_SEED_ADMIN_ENABLED:false}
merhouse.auth.seed-admin.email=${MERHOUSE_AUTH_SEED_ADMIN_EMAIL:}
merhouse.auth.seed-admin.password=${MERHOUSE_AUTH_SEED_ADMIN_PASSWORD:}
merhouse.access-requests.request-limit=${MERHOUSE_ACCESS_REQUEST_LIMIT:3}
merhouse.access-requests.request-window-hours=${MERHOUSE_ACCESS_REQUEST_WINDOW_HOURS:24}
merhouse.deployment.public=${MERHOUSE_DEPLOYMENT_PUBLIC:false}
merhouse.cors.allowed-origins=${MERHOUSE_CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost,capacitor://localhost,ionic://localhost}
merhouse.public.frontend-url=${MERHOUSE_PUBLIC_FRONTEND_URL:http://localhost:3001}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.add-additional-paths=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Firebase Auth integration (always enabled — custom JWT auth has been removed)
# NOTE: firebase.auth.enabled removed — Firebase is always active.
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.project-id=${FIREBASE_PROJECT_ID:merhouse-local}

# Firebase App Check — validates X-Firebase-AppCheck header on every request.
# When enabled, the SecurityConfig adds a filter that checks the header is
# present (header presence check, not cryptographic verification).
# Full cryptographic verification requires upgrading the Admin SDK to v10+.
# Requires a reCAPTCHA Enterprise site key created in the Google Cloud Console.
# Default: disabled (local dev). Set to true in production when the frontend
# App Check initialization is configured with the matching site key.
merhouse.firebase.app-check.enabled=${MERHOUSE_APP_CHECK_ENABLED:false}

# Firebase Cloud Messaging — sends web push notifications via the Admin SDK.
# The frontend must register FCM tokens (via the Firebase Messaging SDK)
# and POST them to /api/v1/notifications/fcm-tokens.
# Default: disabled. FCM is included in the Spark (free) plan.
merhouse.firebase.fcm.enabled=${MERHOUSE_FCM_ENABLED:false}
