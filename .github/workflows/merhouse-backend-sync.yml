name: MerHouse Backend Sync
run-name: MerHouse Backend Sync - ${{ github.ref_name }}

on:
  workflow_run:
    workflows: ["MerHouse Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      env_only:
        description: "Only sync env vars (skip code upload)"
        required: false
        default: "false"
        type: boolean
      code_only:
        description: "Only sync code (skip env vars)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: merhouse-backend-sync-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  sync:
    name: Sync Backend to Hugging Face Space
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-backend
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install huggingface_hub requests

      - name: Validate HF backend secrets
        if: inputs.code_only != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID || 'M7mdHBkr/merhouse-backend' }}
          HF_SPACE_DB_URL: ${{ secrets.HF_SPACE_DB_URL }}
          HF_SPACE_DB_USERNAME: ${{ secrets.HF_SPACE_DB_USERNAME }}
          HF_SPACE_DB_PASSWORD: ${{ secrets.HF_SPACE_DB_PASSWORD }}
          HF_SPACE_FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          MERHOUSE_PUBLIC_FRONTEND_URL: ${{ secrets.MERHOUSE_PUBLIC_FRONTEND_URL }}
          MERHOUSE_CORS_ALLOWED_ORIGINS: ${{ secrets.MERHOUSE_CORS_ALLOWED_ORIGINS }}
          MERHOUSE_DEPLOYMENT_PUBLIC: "true"
          MERHOUSE_AUTH_SEED_ADMIN_ENABLED: "false"
          MERHOUSE_AUTH_RECOVERY_EXPOSE_RESET_TOKEN: "false"
          MERHOUSE_SWAGGER_ENABLED: "false"
        run: |
          cd deploy/managed/huggingface-backend
          python sync-secrets.py --validate --quiet

      - name: Sync env vars to Hugging Face Space (sync-secrets.py)
        if: inputs.code_only != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID || 'M7mdHBkr/merhouse-backend' }}
          HF_SPACE_DB_URL: ${{ secrets.HF_SPACE_DB_URL }}
          HF_SPACE_DB_USERNAME: ${{ secrets.HF_SPACE_DB_USERNAME }}
          HF_SPACE_DB_PASSWORD: ${{ secrets.HF_SPACE_DB_PASSWORD }}
          HF_SPACE_FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          MERHOUSE_PUBLIC_FRONTEND_URL: ${{ secrets.MERHOUSE_PUBLIC_FRONTEND_URL }}
          MERHOUSE_CORS_ALLOWED_ORIGINS: ${{ secrets.MERHOUSE_CORS_ALLOWED_ORIGINS }}
          MERHOUSE_DEPLOYMENT_PUBLIC: "true"
          MERHOUSE_AUTH_SEED_ADMIN_ENABLED: "false"
          MERHOUSE_AUTH_RECOVERY_EXPOSE_RESET_TOKEN: "false"
          MERHOUSE_SWAGGER_ENABLED: "false"
        run: |
          cd deploy/managed/huggingface-backend
          python sync-secrets.py --hf-only --quiet
          echo "Env vars synced."

      - name: Verify HF Space config keys
        if: inputs.code_only != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID || 'M7mdHBkr/merhouse-backend' }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE_REPO_ID"]
          expected_vars = {
              "SPRING_DATASOURCE_URL",
              "SPRING_DATASOURCE_USERNAME",
              "MERHOUSE_DEPLOYMENT_PUBLIC",
              "MERHOUSE_PUBLIC_FRONTEND_URL",
              "MERHOUSE_CORS_ALLOWED_ORIGINS",
              "MERHOUSE_AUTH_SEED_ADMIN_ENABLED",
              "MERHOUSE_AUTH_RECOVERY_EXPOSE_RESET_TOKEN",
              "MERHOUSE_SWAGGER_ENABLED",
              "FIREBASE_PROJECT_ID",
          }
          expected_secrets = {
              "SPRING_DATASOURCE_PASSWORD",
              "FIREBASE_SERVICE_ACCOUNT_JSON",
          }
          vars = set(api.get_space_variables(repo_id=space).keys())
          secrets = set(api.get_space_secrets(repo_id=space).keys())
          missing_vars = sorted(expected_vars - vars)
          missing_secrets = sorted(expected_secrets - secrets)
          if missing_vars or missing_secrets:
              raise SystemExit(f"missing HF Space config: vars={missing_vars} secrets={missing_secrets}")
          print("hf_space_config_keys=ok")
          PY

      - name: Sync code to Hugging Face Space (sync-hf-space.py)
        if: inputs.env_only != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID || 'M7mdHBkr/merhouse-backend' }}
        run: |
          cd deploy/managed/huggingface-backend
          python sync-hf-space.py --upload-only
          echo "Code synced."

      - name: Verify HF Space source files
        if: inputs.env_only != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID || 'M7mdHBkr/merhouse-backend' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE_REPO_ID"]
          remote = set(api.list_repo_files(repo_id=space, repo_type="space"))
          expected = {"Dockerfile", "README.md"}
          for path in Path("backend").rglob("*"):
              if not path.is_file():
                  continue
              if set(path.parts) & {"target", "build", ".gradle"}:
                  continue
              if path.name.endswith((".log", ".tmp")):
                  continue
              expected.add("backend/" + path.relative_to("backend").as_posix())
          missing = sorted(expected - remote)
          if missing:
              raise SystemExit("missing HF Space source files: " + ", ".join(missing[:20]))
          print(f"hf_space_source_files=ok count={len(expected)}")
          PY

      - name: Restart Space to trigger rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID || 'M7mdHBkr/merhouse-backend' }}
        run: |
          cd deploy/managed/huggingface-backend
          python -c "import os; from huggingface_hub import HfApi; api = HfApi(token=os.environ['HF_TOKEN']); api.restart_space(repo_id=os.environ['HF_SPACE_REPO_ID']); print('Space restarted.')"
          echo "Restart initiated."

      - name: Wait for Space to become healthy
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID || 'M7mdHBkr/merhouse-backend' }}
        run: |
          cd deploy/managed/huggingface-backend
          python sync-hf-space.py --health --timeout 25
          echo "Health check complete."

      - name: Create deployment status
        uses: actions/github-script@v7
        env:
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID || 'M7mdHBkr/merhouse-backend' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const repoId = process.env.HF_SPACE_REPO_ID;
            if (!repoId) {
              console.log('HF_SPACE_REPO_ID not set. Skipping deployment status.');
              return;
            }
            const owner = repoId.split('/')[0].toLowerCase();
            const spaceName = repoId.split('/')[1].toLowerCase();
            const spaceUrl = `https://${owner}-${spaceName}.hf.space`;
            const headSha = process.env.HEAD_SHA;
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              environment: 'production-backend',
              description: `Hugging Face Spaces - ${repoId}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true
            }).then(async (deployment) => {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: spaceUrl,
                description: 'Backend deployed to Hugging Face Space',
                log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              console.log(`Deployment created: ${spaceUrl}`);
            }).catch(err => {
              console.log('Deployment status skipped:', err.message);
            });
