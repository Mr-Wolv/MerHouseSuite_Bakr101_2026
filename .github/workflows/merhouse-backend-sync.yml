name: MerHouse Backend Sync
run-name: MerHouse Backend Sync - ${{ github.ref_name }}

on:
  workflow_run:
    workflows: ["MerHouse Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: merhouse-backend-sync-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  sync:
    name: Sync Backend to Hugging Face Space
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only deploy when Quality Gate passes on main, or on manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install huggingface_hub requests

      - name: Sync to Hugging Face Space (sync + wait for build)
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_DB_URL: ${{ secrets.HF_SPACE_DB_URL }}
          HF_SPACE_DB_USERNAME: ${{ secrets.HF_SPACE_DB_USERNAME }}
          HF_SPACE_DB_PASSWORD: ${{ secrets.HF_SPACE_DB_PASSWORD }}
          HF_SPACE_FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN not configured. Skipping sync."
            exit 0
          fi
          cd deploy/managed/huggingface-backend
          python sync-hf-space.py --wipe --wait --timeout 30
          echo 'Sync complete.'

      - name: Verify API health
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN not configured. Skipping health check."
            exit 0
          fi
          cd deploy/managed/huggingface-backend
          python sync-hf-space.py --health --timeout 10

      - name: Create deployment status
        uses: actions/github-script@v7
        env:
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const repoId = process.env.HF_SPACE_REPO_ID;
            if (!repoId) {
              console.log('HF_SPACE_REPO_ID not set. Skipping deployment status.');
              return;
            }
            const owner = repoId.split('/')[0].toLowerCase();
            const spaceName = repoId.split('/')[1].toLowerCase();
            const spaceUrl = `https://${owner}-${spaceName}.hf.space`;
            const headSha = process.env.HEAD_SHA;
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              environment: 'production-backend',
              description: `Hugging Face Spaces - ${repoId}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true
            }).then(async (deployment) => {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: spaceUrl,
                description: 'Backend deployed to Hugging Face Space',
                log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              console.log(`Deployment created: ${spaceUrl}`);
            }).catch(err => {
              console.log('Deployment status skipped:', err.message);
            });
