name: MerHouse Backend Sync
run-name: MerHouse Backend Sync - ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/managed/huggingface-backend/**'
      - '.github/workflows/merhouse-backend-sync.yml'
      - '.github/workflows/merhouse-quality-gate.yml'
  workflow_dispatch:

concurrency:
  group: merhouse-backend-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  sync:
    name: Sync Backend to Hugging Face Space
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Sync backend source to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_REPO_ID" ]; then
            echo "HF_SPACE_TOKEN or HF_SPACE_REPO_ID not configured. Skipping sync."
            exit 0
          fi
          python -c "
import os
from huggingface_hub import upload_folder

repo_id = os.environ['HF_SPACE_REPO_ID']
folder_path = 'backend'
token = os.environ['HF_TOKEN']

upload_folder(
    repo_id=repo_id,
    repo_type='space',
    folder_path=folder_path,
    path_in_repo='backend',
    token=token,
    commit_message='Sync MerHouse backend from commit ${{ github.sha }}',
    ignore_patterns=[
        'target/**',
        '.gradle/**',
        'build/**',
        '*.log',
        '*.tmp',
    ],
)
print('Backend source synced to Hugging Face Space.')
"

      - name: Sync Space Dockerfile and README
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_REPO_ID" ]; then
            echo "HF_SPACE_TOKEN or HF_SPACE_REPO_ID not configured. Skipping sync."
            exit 0
          fi
          python -c "
import os
from huggingface_hub import upload_file

repo_id = os.environ['HF_SPACE_REPO_ID']
token = os.environ['HF_TOKEN']

upload_file(
    repo_id=repo_id,
    repo_type='space',
    path_or_fileobj='deploy/managed/huggingface-backend/Dockerfile',
    path_in_repo='Dockerfile',
    token=token,
)
print('Dockerfile synced.')

upload_file(
    repo_id=repo_id,
    repo_type='space',
    path_or_fileobj='deploy/managed/huggingface-backend/space-readme-template.md',
    path_in_repo='README.md',
    token=token,
)
print('Space README synced.')
"

      - name: Sync environment variables to Space Settings
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
          HF_SPACE_VARS: ${{ secrets.HF_SPACE_VARS }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_REPO_ID" ] || [ -z "$HF_SPACE_VARS" ]; then
            echo "HF_SPACE_VARS not configured. Skipping env sync."
            exit 0
          fi
          python -c "
import os, json
from huggingface_hub import HfApi

repo_id = os.environ['HF_SPACE_REPO_ID']
token = os.environ['HF_TOKEN']
vars_json = os.environ.get('HF_SPACE_VARS', '{}')

api = HfApi(token=token)
payload = json.loads(vars_json)

try:
    existing_secrets = {s.key for s in api.list_secrets(repo_id=repo_id)}
    for key in payload.get('secrets', {}):
        if key in existing_secrets:
            api.delete_space_secret(repo_id=repo_id, key=key)
    for key, value in payload.get('secrets', {}).items():
        api.add_space_secret(repo_id=repo_id, key=key, value=value)
        print(f'  secret set: {key}')
except Exception as e:
    print(f'  warning syncing secrets: {e}')

try:
    existing_vars = {v.key for v in api.list_variables(repo_id=repo_id)}
    for key in payload.get('variables', {}):
        if key in existing_vars:
            api.delete_space_variable(repo_id=repo_id, key=key)
    for key, value in payload.get('variables', {}).items():
        api.add_space_variable(repo_id=repo_id, key=key, value=value)
        print(f'  variable set: {key}')
except Exception as e:
    print(f'  warning syncing variables: {e}')

print('Environment variables synced to Space Settings.')
"

      - name: Create deployment status
        uses: actions/github-script@v7
        env:
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
        if: env.HF_SPACE_REPO_ID != ''
        with:
          script: |
            const repoId = process.env.HF_SPACE_REPO_ID;
            const owner = repoId.split('/')[0].toLowerCase();
            const spaceName = repoId.split('/')[1].toLowerCase();
            const spaceUrl = `https://${owner}-${spaceName}.hf.space`;

            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production-backend',
              description: `Hugging Face Spaces - ${repoId}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true
            }).then(async (deployment) => {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: spaceUrl,
                description: 'Backend deployed to Hugging Face Space',
                log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              console.log(`Deployment created: ${spaceUrl}`);
            }).catch(err => {
              console.log('Deployment status skipped:', err.message);
            });
