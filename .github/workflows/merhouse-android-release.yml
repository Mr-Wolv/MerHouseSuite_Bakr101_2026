name: MerHouse Android Release
run-name: MerHouse Android Release - ${{ inputs.version_name || github.event_name }} on ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode"
        required: true
        default: "17"
      version_name:
        description: "Android versionName"
        required: true
        default: "0.17.0-internal"
      tag:
        description: "GitHub release tag to create or update"
        required: true
        default: "android-v0.17.0-internal"
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: merhouse-android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Unified Android build: signed when secrets exist, unsigned on push ─
  # Runs on every push to main (like Vercel auto-builds the frontend).
  # Produces a signed APK + GitHub Release on workflow_dispatch.
  build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Decode signing keystore
        id: keystore
        if: env.MERHOUSE_ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        env:
          MERHOUSE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MERHOUSE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$MERHOUSE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/merhouse-release.jks"
          echo "path=$RUNNER_TEMP/merhouse-release.jks" >> "$GITHUB_OUTPUT"
          echo "Signing keystore decoded successfully."

      - name: Build Android APK
        shell: pwsh
        env:
          MERHOUSE_ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MERHOUSE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MERHOUSE_ANDROID_KEYSTORE_PASSWORD }}
          MERHOUSE_ANDROID_KEY_ALIAS: ${{ secrets.MERHOUSE_ANDROID_KEY_ALIAS }}
          MERHOUSE_ANDROID_KEY_PASSWORD: ${{ secrets.MERHOUSE_ANDROID_KEY_PASSWORD }}
          MERHOUSE_ANDROID_API_BASE_URL: ${{ secrets.MERHOUSE_ANDROID_API_BASE_URL }}
          MERHOUSE_ANDROID_FRONTEND_URL: ${{ secrets.MERHOUSE_ANDROID_FRONTEND_URL }}
          MERHOUSE_ANDROID_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '17' }}
          MERHOUSE_ANDROID_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || '0.17.0-internal' }}
        run: |
          $hasSigning = -not [string]::IsNullOrWhiteSpace($env:MERHOUSE_ANDROID_KEYSTORE_PATH)
          $hasFrontendUrl = -not [string]::IsNullOrWhiteSpace($env:MERHOUSE_ANDROID_FRONTEND_URL)
          if ($hasSigning -and $hasFrontendUrl) {
            Write-Host "Building signed APK with deployed URLs."
            ./scripts/proof/android/native-android-release-check.ps1 `
              -ApiBaseUrl "$env:MERHOUSE_ANDROID_API_BASE_URL" `
              -FrontendUrl "$env:MERHOUSE_ANDROID_FRONTEND_URL" `
              -OutputPath "reports/v17-android-release-$env:MERHOUSE_ANDROID_VERSION_NAME.json"
          } else {
            Write-Host "Building unsigned debug APK (signing secrets not configured)."
            $fallbackApiUrl = if ($env:MERHOUSE_ANDROID_API_BASE_URL) { $env:MERHOUSE_ANDROID_API_BASE_URL } else { "http://10.0.2.2:8080" }
            ./scripts/proof/android/native-mobile-check.ps1 -Assemble -ApiBaseUrl $fallbackApiUrl
          }

      - name: Publish GitHub Release
        if: steps.keystore.outputs.path != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('android-v{0}', github.run_number) }}"
          VERSION_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.version_name || format('0.17.0-build.{0}', github.run_number) }}"
          PRERELEASE="${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'true' }}"
          COMMIT_SHA="${{ github.sha }}"
          notes="Signed MerHouse Android APK built from commit ${COMMIT_SHA}. Install only after deployed web/backend proof passes."

          prerelease_flag="--prerelease=$PRERELEASE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$COMMIT_SHA" \
              --title "MerHouse Android $VERSION_NAME" \
              --notes "$notes" \
              $prerelease_flag
            gh release upload "$TAG" \
              frontend/android/app/build/outputs/apk/release/app-release.apk \
              --clobber
          else
            gh release create "$TAG" \
              frontend/android/app/build/outputs/apk/release/app-release.apk \
              --target "$COMMIT_SHA" \
              --title "MerHouse Android $VERSION_NAME" \
              --notes "$notes" \
              $prerelease_flag
          fi
