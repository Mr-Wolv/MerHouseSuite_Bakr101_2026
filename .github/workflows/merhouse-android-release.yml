name: MerHouse Android Release
run-name: MerHouse Android Release - ${{ inputs.version_name || 'auto' }} on ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode"
        required: true
        default: "17"
      version_name:
        description: "Android versionName"
        required: true
        default: "0.17.0-internal"
      tag:
        description: "GitHub release tag to create or update"
        required: true
        default: "android-v0.17.0-internal"
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: merhouse-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Unified Android build: signed when secrets exist, unsigned on push ─
  # Runs on every push to main (like Vercel auto-builds the frontend).
  # Produces a signed APK + GitHub Release on workflow_dispatch.
  build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Signed APK + Release' || 'Android Build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MERHOUSE_ANDROID_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '17' }}
      MERHOUSE_ANDROID_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || '0.17.0-internal' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Decode signing keystore
        id: keystore
        if: secrets.MERHOUSE_ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        env:
          MERHOUSE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MERHOUSE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$MERHOUSE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/merhouse-release.jks"
          echo "path=$RUNNER_TEMP/merhouse-release.jks" >> "$GITHUB_OUTPUT"
          echo "Signing keystore decoded successfully."

      - name: Build Android APK
        shell: pwsh
        env:
          MERHOUSE_ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MERHOUSE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MERHOUSE_ANDROID_KEYSTORE_PASSWORD }}
          MERHOUSE_ANDROID_KEY_ALIAS: ${{ secrets.MERHOUSE_ANDROID_KEY_ALIAS }}
          MERHOUSE_ANDROID_KEY_PASSWORD: ${{ secrets.MERHOUSE_ANDROID_KEY_PASSWORD }}
        run: |
          $hasSigning = -not [string]::IsNullOrWhiteSpace($env:MERHOUSE_ANDROID_KEYSTORE_PATH)
          $apiUrl = if (-not [string]::IsNullOrWhiteSpace('${{ secrets.MERHOUSE_ANDROID_API_BASE_URL }}')) {
            '${{ secrets.MERHOUSE_ANDROID_API_BASE_URL }}'
          } else {
            'http://10.0.2.2:8080'
          }
          $frontendUrl = if (-not [string]::IsNullOrWhiteSpace('${{ secrets.MERHOUSE_ANDROID_FRONTEND_URL }}')) {
            '${{ secrets.MERHOUSE_ANDROID_FRONTEND_URL }}'
          } else {
            ''
          }
          if ($hasSigning -and $frontendUrl) {
            Write-Host "Building signed APK with deployed URLs."
            ./scripts/proof/android/native-android-release-check.ps1 `
              -ApiBaseUrl $apiUrl `
              -FrontendUrl $frontendUrl `
              -OutputPath "reports/v17-android-release-$env:MERHOUSE_ANDROID_VERSION_NAME.json"
          } else {
            Write-Host "Building unsigned debug APK (signing secrets not configured)."
            ./scripts/proof/android/native-mobile-check.ps1 -Assemble -ApiBaseUrl $apiUrl
          }

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'signed-apk' || 'debug-apk' }}
          path: frontend/android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag="--prerelease=${{ inputs.prerelease }}"
          notes="Signed MerHouse Android APK for the current deployed web/backend lane. Install only after deployed web/backend proof passes."
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ inputs.tag }}" \
              --target "${{ github.sha }}" \
              --title "MerHouse Android ${{ inputs.version_name }}" \
              --notes "$notes" \
              $prerelease_flag
            gh release upload "${{ inputs.tag }}" \
              frontend/android/app/build/outputs/apk/release/app-release.apk \
              --clobber
          else
            gh release create "${{ inputs.tag }}" \
              frontend/android/app/build/outputs/apk/release/app-release.apk \
              --target "${{ github.sha }}" \
              --title "MerHouse Android ${{ inputs.version_name }}" \
              --notes "$notes" \
              $prerelease_flag
          fi
