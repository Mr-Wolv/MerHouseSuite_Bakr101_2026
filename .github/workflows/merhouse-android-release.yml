name: MerHouse Android Release
run-name: MerHouse Android Release - ${{ inputs.version_name }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode"
        required: true
        default: "17"
      version_name:
        description: "Android versionName"
        required: true
        default: "0.17.0-internal"
      tag:
        description: "GitHub release tag to create or update"
        required: true
        default: "android-v0.17.0-internal"
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: merhouse-android-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  signed-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Decode signing keystore
        shell: bash
        env:
          MERHOUSE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MERHOUSE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MERHOUSE_ANDROID_KEYSTORE_BASE64" ]; then
            echo "MERHOUSE_ANDROID_KEYSTORE_BASE64 secret is required." >&2
            exit 1
          fi
          printf '%s' "$MERHOUSE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/merhouse-release.jks"

      - name: Build signed internal APK
        shell: pwsh
        env:
          MERHOUSE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/merhouse-release.jks
          MERHOUSE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MERHOUSE_ANDROID_KEYSTORE_PASSWORD }}
          MERHOUSE_ANDROID_KEY_ALIAS: ${{ secrets.MERHOUSE_ANDROID_KEY_ALIAS }}
          MERHOUSE_ANDROID_KEY_PASSWORD: ${{ secrets.MERHOUSE_ANDROID_KEY_PASSWORD }}
          MERHOUSE_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          MERHOUSE_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          MERHOUSE_ANDROID_API_BASE_URL: ${{ secrets.MERHOUSE_ANDROID_API_BASE_URL }}
          MERHOUSE_ANDROID_FRONTEND_URL: ${{ secrets.MERHOUSE_ANDROID_FRONTEND_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MERHOUSE_ANDROID_API_BASE_URL)) {
            throw "MERHOUSE_ANDROID_API_BASE_URL secret is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:MERHOUSE_ANDROID_FRONTEND_URL)) {
            throw "MERHOUSE_ANDROID_FRONTEND_URL secret is required."
          }
          ./scripts/proof/android/native-android-release-check.ps1 `
            -ApiBaseUrl "$env:MERHOUSE_ANDROID_API_BASE_URL" `
            -FrontendUrl "$env:MERHOUSE_ANDROID_FRONTEND_URL" `
            -OutputPath "reports/v17-android-release-${{ inputs.version_name }}.json"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag="--prerelease=${{ inputs.prerelease }}"
          notes="Signed MerHouse Android APK for the current deployed web/backend lane. Install only after deployed web/backend proof passes."
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ inputs.tag }}" \
              --target "${{ github.sha }}" \
              --title "MerHouse Android ${{ inputs.version_name }}" \
              --notes "$notes" \
              $prerelease_flag
            gh release upload "${{ inputs.tag }}" \
              frontend/android/app/build/outputs/apk/release/app-release.apk \
              --clobber
          else
            gh release create "${{ inputs.tag }}" \
              frontend/android/app/build/outputs/apk/release/app-release.apk \
              --target "${{ github.sha }}" \
              --title "MerHouse Android ${{ inputs.version_name }}" \
              --notes "$notes" \
              $prerelease_flag
          fi
