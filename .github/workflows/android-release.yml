name: MerHouse Android Release
run-name: MerHouse Android Release - ${{ inputs.version_name }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Render backend HTTPS URL compiled into the APK"
        required: true
      version_code:
        description: "Android versionCode"
        required: true
        default: "17"
      version_name:
        description: "Android versionName"
        required: true
        default: "0.17.0-internal"
      tag:
        description: "GitHub release tag to create or update"
        required: true
        default: "android-v0.17.0-internal"
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  signed-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Decode signing keystore
        shell: bash
        env:
          MERHOUSE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MERHOUSE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MERHOUSE_ANDROID_KEYSTORE_BASE64" ]; then
            echo "MERHOUSE_ANDROID_KEYSTORE_BASE64 secret is required." >&2
            exit 1
          fi
          printf '%s' "$MERHOUSE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/merhouse-release.jks"

      - name: Build signed internal APK
        shell: pwsh
        env:
          MERHOUSE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/merhouse-release.jks
          MERHOUSE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MERHOUSE_ANDROID_KEYSTORE_PASSWORD }}
          MERHOUSE_ANDROID_KEY_ALIAS: ${{ secrets.MERHOUSE_ANDROID_KEY_ALIAS }}
          MERHOUSE_ANDROID_KEY_PASSWORD: ${{ secrets.MERHOUSE_ANDROID_KEY_PASSWORD }}
          MERHOUSE_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          MERHOUSE_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          ./scripts/quality/native-android-release-check.ps1 `
            -ApiBaseUrl "${{ inputs.api_base_url }}" `
            -OutputPath "reports/v17-android-release-${{ inputs.version_name }}.json"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: merhouse-signed-release-apk
          path: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            reports/v17-android-release-${{ inputs.version_name }}.json
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${{ inputs.tag }}" \
            frontend/android/app/build/outputs/apk/release/app-release.apk \
            "reports/v17-android-release-${{ inputs.version_name }}.json" \
            --target "${{ github.sha }}" \
            --title "MerHouse Android ${{ inputs.version_name }}" \
            --notes "Signed MerHouse Android APK built against ${{ inputs.api_base_url }}. Install only after deployed web/backend proof passes." \
            $prerelease_flag
