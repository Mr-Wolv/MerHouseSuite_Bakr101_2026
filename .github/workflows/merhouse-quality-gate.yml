name: MerHouse Quality Gate
run-name: MerHouse Quality Gate - ${{ github.event_name }} on ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: merhouse-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        env:
          FIREBASE_EMULATOR_HOST: "true"
        run: ./mvnw test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run performance readiness
        shell: pwsh
        run: ./scripts/proof/release/performance-readiness.ps1

  native-android:
    name: Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Android debug APK
        shell: pwsh
        run: ./scripts/proof/android/native-mobile-check.ps1 -Assemble -ApiBaseUrl "http://10.0.2.2:8080"

  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

  public-readiness:
    name: Public Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Check markdown links
        shell: pwsh
        run: ./scripts/quality/markdown-check.ps1

      - name: Check PowerShell scripts parse
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $errors += $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PowerShell script parser check passed."

      - name: Check shared mobile shell
        shell: pwsh
        run: ./scripts/proof/android/mobile-shell-check.ps1

      - name: Run public readiness checks
        shell: pwsh
        run: ./scripts/quality/public-readiness.ps1 -SkipCompose

  v17-deployment-preflight:
    name: V17 Deployment Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run V17 deployment preflight
        shell: pwsh
        run: ./scripts/quality/v17-production-readiness.ps1

  integration-proof:
    name: Integration Proof
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs:
      - backend
      - frontend
      - native-android
      - compose
      - public-readiness
      - v17-deployment-preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create masked CI environment
        shell: bash
        run: |
          ci_postgres_password="$(openssl rand -hex 32)"
          ci_admin_email="admin@merhouse.local"
          ci_admin_password="$(openssl rand -hex 32)"
          ci_review_password="$(openssl rand -hex 32)"

          echo "::add-mask::$ci_postgres_password"
          echo "::add-mask::$ci_admin_password"
          echo "::add-mask::$ci_review_password"

          {
            echo "CI_ADMIN_EMAIL=$ci_admin_email"
            echo "CI_ADMIN_PASSWORD=$ci_admin_password"
            echo "CI_REVIEW_PASSWORD=$ci_review_password"
          } >> "$GITHUB_ENV"

          cat > .env <<EOF
          MERHOUSE_POSTGRES_DB=merhouse
          MERHOUSE_POSTGRES_USER=merhouse_local
          MERHOUSE_POSTGRES_PASSWORD=$ci_postgres_password
          MERHOUSE_AUTH_RECOVERY_EXPOSE_RESET_TOKEN=false
          MERHOUSE_AUTH_SEED_ADMIN_ENABLED=true
          MERHOUSE_AUTH_SEED_ADMIN_EMAIL=$ci_admin_email
          MERHOUSE_AUTH_SEED_ADMIN_PASSWORD=$ci_admin_password
          MERHOUSE_SWAGGER_ENABLED=true
          MERHOUSE_DEPLOYMENT_PUBLIC=false
          MERHOUSE_BACKEND_PORT=8080
          MERHOUSE_FRONTEND_PORT=3001
          MERHOUSE_CORS_ALLOWED_ORIGINS=http://localhost:3001,http://localhost,capacitor://localhost,ionic://localhost
          FIREBASE_PROJECT_ID=merhouse-local
          FIREBASE_EMULATOR_HOST=firebase-emulators:9099
          FIREBASE_AUTH_EMULATOR_HOST=firebase-emulators:9099
          VITE_FIREBASE_API_KEY=emulator-api-key
          VITE_FIREBASE_AUTH_DOMAIN=merhouse-local.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=merhouse-local
          VITE_FIREBASE_STORAGE_BUCKET=merhouse-local.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000
          VITE_FIREBASE_APP_ID=1:000000000000:web:000000000000
          VITE_FIREBASE_EMULATOR_HOST=http://127.0.0.1:9099
          EOF

      - name: Start Docker Compose stack
        run: docker compose --env-file .env up --build -d

      - name: Wait for Firebase emulator
        shell: bash
        run: |
          echo "Waiting for Firebase Auth emulator on port 9099..."
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9099/ 2>/dev/null || echo '000')
            if [ "$code" != "000" ]; then
              echo "Firebase emulator ready (HTTP $code) at attempt $i."
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 3
          done

      - name: Wait for backend login via Firebase Auth
        shell: pwsh
        run: |
          $firebaseUrl = "http://localhost:9099/identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=emulator-api-key"
          $body = @{
            email = $env:CI_ADMIN_EMAIL
            password = $env:CI_ADMIN_PASSWORD
            returnSecureToken = $true
          } | ConvertTo-Json

          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $response = Invoke-RestMethod -Method Post -Uri $firebaseUrl -ContentType "application/json" -Body $body
              if ($response.idToken) {
                Write-Host "Firebase Auth accepted seeded owner login."
                exit 0
              }
            } catch {
              Write-Host "Waiting for Firebase Auth login readiness ($attempt/60)..."
              Start-Sleep -Seconds 5
            }
          }

          throw "Firebase Auth did not accept seeded owner login before timeout."

      - name: Run API smoke
        shell: pwsh
        run: ./scripts/quality/api-smoke.ps1 -BaseUrl "http://localhost:8080" -OutputPath "reports/ci-api-smoke.json" -AdminEmail $env:CI_ADMIN_EMAIL -AdminPassword $env:CI_ADMIN_PASSWORD

      - name: Seed frontend tour data
        shell: pwsh
        run: ./scripts/local/seed-demo.ps1 -BaseUrl "http://localhost:8080" -AdminEmail $env:CI_ADMIN_EMAIL -AdminPassword $env:CI_ADMIN_PASSWORD -CreateReviewAccounts -ReviewPassword $env:CI_REVIEW_PASSWORD -Suffix "ci" -SuppressCredentialOutput

      - name: Run frontend full tour
        shell: pwsh
        run: ./scripts/proof/web/frontend-full-tour.ps1 -BaseUrl "http://localhost:3001" -ApiUrl "http://localhost:3001" -AdminEmail $env:CI_ADMIN_EMAIL -AdminPassword $env:CI_ADMIN_PASSWORD -MerchantPassword $env:CI_REVIEW_PASSWORD -WarehousePassword $env:CI_REVIEW_PASSWORD -SupportAdminPassword $env:CI_REVIEW_PASSWORD -AuditorPassword $env:CI_REVIEW_PASSWORD -OutputPath "reports/ci-frontend-full-tour.json"

      - name: Run Playwright E2E tests
        shell: pwsh
        working-directory: frontend
        env:
          FRONTEND_TOUR_BASE_URL: "http://localhost:3001"
          E2E_API_URL: "http://localhost:8080"
          E2E_FIREBASE_EMULATOR: "http://localhost:9099"
          FRONTEND_TOUR_ADMIN_EMAIL: ${{ env.CI_ADMIN_EMAIL }}
          FRONTEND_TOUR_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
          FRONTEND_TOUR_SUPPORT_ADMIN_EMAIL: "review.support@merhouse.local"
          FRONTEND_TOUR_SUPPORT_ADMIN_PASSWORD: ${{ env.CI_REVIEW_PASSWORD }}
          FRONTEND_TOUR_AUDITOR_EMAIL: "review.auditor@merhouse.local"
          FRONTEND_TOUR_AUDITOR_PASSWORD: ${{ env.CI_REVIEW_PASSWORD }}
          FRONTEND_TOUR_MERCHANT_EMAIL: "review.merchant@merhouse.local"
          FRONTEND_TOUR_MERCHANT_PASSWORD: ${{ env.CI_REVIEW_PASSWORD }}
          FRONTEND_TOUR_WAREHOUSE_EMAIL: "review.operator@merhouse.local"
          FRONTEND_TOUR_WAREHOUSE_PASSWORD: ${{ env.CI_REVIEW_PASSWORD }}
        run: npx playwright test --reporter=list tests/e2e/full-tour.spec.ts tests/e2e/admin-console.spec.ts tests/e2e/qc-integration.spec.ts

      - name: Print Docker Compose logs
        if: failure()
        run: docker compose --env-file .env logs --no-color

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose --env-file .env down -v
